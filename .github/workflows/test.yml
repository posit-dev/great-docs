name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  build:
    name: "Tests (Python ${{ matrix.python-version }}, ${{ matrix.resolution }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            resolution: lowest-direct
          - python-version: "3.14"
            resolution: highest
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: Install dependencies
        run: |
          uv lock --resolution ${{ matrix.resolution }}
          uv sync --extra dev --frozen

      - name: Install d2 (for the diagram-rendering integration test)
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s -- --version v0.8.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/d2" --version

      - name: Run tests
        run: |
          make test

      - name: Test CLI
        run: |
          uv run --frozen great-docs --help
          uv run --frozen great-docs --version

  release-pypi:
    name: "Release to PyPI"
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: build
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: "Build Package"
        run: |
          python -m pip install build wheel
          python -m build --sdist --wheel

      - name: "Deploy to PyPI"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
